<!doctype html>
<meta charset="utf-8">
<title>CMH-loading</title>
<!--
  Helper page for the Custom Match History mod. The mod opens it in a hidden browser
  panel with a request in the URL fragment:
    #save:<account id>:<match id>:<mode label>   remember a custom match on this PC
    #list:<account id>                           the logged-in player's list: saved matches plus any
                                                 the Deadlock API knows
    #view:<account id>                           the same for another player's profile
    #hide:<account id>:<match id>                remove a match from that player's list on this PC,
                                                 then answer like #list
  The answer goes back through the page title, starting with "CMH|".

  Saved and removed IDs stay in this PC's browser storage and are never sent anywhere. The
  only outside request is to the Deadlock API, and it only sends the account ID.
-->
<script>
(function () {
  var API = "https://api.deadlock-api.com/v1/matches/metadata";
  var STORE_KEY = "cmh_matches_v1";
  var HIDDEN_KEY = "cmh_hidden_v1"; // { account: [match id, ...] } removed by the player
  var UNKNOWN_ACCOUNT = "0";
  var MAX_SAVED = 500;
  var MAX_ROWS = 60; // Page titles are limited to about 4096 characters.
  var API_TIMEOUT_MS = 8000;

  function answer(value) {
    document.title = "CMH|" + JSON.stringify(value);
  }

  function fail(reason) {
    document.title = "CMH|ERR:" + reason;
  }

  function readJson(key) {
    try {
      return JSON.parse(localStorage.getItem(key)) || {};
    } catch (e) {
      return {};
    }
  }

  function readStore() {
    return readJson(STORE_KEY);
  }

  function writeJson(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      return false;
    }
  }

  // Matches saved before the account was known belong to whoever is logged in next.
  function claimUnknown(store, account) {
    var unknown = store[UNKNOWN_ACCOUNT];
    if (!unknown || account === UNKNOWN_ACCOUNT) return;
    var mine = store[account] || [];
    var have = {};
    mine.forEach(function (s) { have[s[0]] = true; });
    store[account] = mine.concat(unknown.filter(function (s) { return !have[s[0]]; })).slice(0, MAX_SAVED);
    delete store[UNKNOWN_ACCOUNT];
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(store));
    } catch (e) {}
  }

  // [match id, mode label, time, won, hero, kills, deaths, assists, souls, duration]
  function savedToRow(saved) {
    return [saved[0], saved[1], saved[2], null, null, null, null, null, null, null];
  }

  function team(value) {
    return value === "Team0" ? 0 : value === "Team1" ? 1 : -1;
  }

  function apiToRow(m) {
    var p = (m.players || [])[0] || {};
    var mode = m.game_mode === "StreetBrawl" ? "Street Brawl" : "Standard Match";
    return [m.match_id, mode, String(m.start_time).substring(0, 16) + " UTC", team(m.winning_team) === team(p.team) ? 1 : 0, p.hero_id, p.kills, p.deaths, p.assists, p.net_worth, m.duration_s];
  }

  function merge(saved, known, hidden) {
    var skip = {};
    (hidden || []).forEach(function (id) { skip[id] = true; });
    var rows = {};
    saved.forEach(function (s) { if (!skip[s[0]]) rows[s[0]] = savedToRow(s); });
    known.forEach(function (m) {
      if (skip[m.match_id]) return;
      var row = apiToRow(m);
      if (rows[row[0]]) row[1] = rows[row[0]][1];
      rows[row[0]] = row;
    });
    return Object.keys(rows).map(function (id) { return rows[id]; })
      .sort(function (a, b) { return b[0] - a[0]; })
      .slice(0, MAX_ROWS);
  }

  function apiMatches(account) {
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, API_TIMEOUT_MS);
    return fetch(API + "?account_ids=" + account + "&match_mode=private_lobby&include_info=true&include_player_info=true&only_filtered_players=true&limit=" + MAX_ROWS + "&order_by=match_id&order_direction=desc", { signal: controller.signal })
      .then(function (response) { return response.ok ? response.json() : []; })
      // The list still works from saved IDs when the API is busy or unreachable.
      .catch(function () { return []; })
      .then(function (list) { clearTimeout(timer); return list; });
  }

  function list(account, claim) {
    var store = readStore();
    if (claim) claimUnknown(store, account);
    var saved = store[account] || [];
    var hidden = readJson(HIDDEN_KEY)[account] || [];
    apiMatches(account).then(function (known) { answer(merge(saved, known, hidden)); });
  }

  function hide(account, matchId) {
    var id = Number(matchId);
    var store = readStore();
    if (store[account]) store[account] = store[account].filter(function (s) { return Number(s[0]) !== id; });
    var hidden = readJson(HIDDEN_KEY);
    var mine = (hidden[account] || []).filter(function (h) { return h !== id; });
    mine.unshift(id);
    hidden[account] = mine.slice(0, MAX_SAVED);
    if (!writeJson(STORE_KEY, store) || !writeJson(HIDDEN_KEY, hidden)) {
      fail("could not remove");
      return;
    }
    list(account, true);
  }

  function save(account, matchId, label) {
    var id = Number(matchId);
    var store = readStore();
    var mine = store[account] || [];
    var exists = mine.some(function (s) { return Number(s[0]) === id; });
    if (!exists) {
      mine.unshift([id, label.substring(0, 40), new Date().toISOString().substring(0, 16).replace("T", " ") + " UTC"]);
      store[account] = mine.slice(0, MAX_SAVED);
      if (!writeJson(STORE_KEY, store)) {
        fail("could not save");
        return;
      }
    }
    // Saving a removed match again, by opening it, puts it back on the list.
    var hidden = readJson(HIDDEN_KEY);
    if (hidden[account] && hidden[account].indexOf(id) >= 0) {
      hidden[account] = hidden[account].filter(function (h) { return h !== id; });
      writeJson(HIDDEN_KEY, hidden);
    }
    answer(merge(store[account] || [], []));
  }

  var request = location.hash.slice(1).match(/^(list|view|save|hide):([0-9]{1,12})(?::([0-9]{1,20})(?::(.*))?)?$/);
  if (!request || ((request[1] === "save" || request[1] === "hide") && !request[3])) {
    fail("bad request");
    return;
  }

  if (request[1] === "hide") {
    hide(request[2], request[3]);
  } else if (request[1] !== "save") {
    list(request[2], request[1] === "list");
  } else {
    var label = "";
    try {
      label = decodeURIComponent(request[4] || "");
    } catch (e) {}
    save(request[2], request[3], label);
  }
})();
</script>
